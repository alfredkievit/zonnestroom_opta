        above: 14.99
      card:
        type: tile
        entity: sensor.kamersensor_hal_batterij
        name: Hal
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kamersensor_hal_batterij
        below: 15
      card:
        type: tile
        entity: sensor.kamersensor_hal_batterij
        name: Hal
        color: red
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kamersensor_madoe_batterij
        above: 14.99
      card:
        type: tile
        entity: sensor.kamersensor_madoe_batterij
        name: Madoe
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kamersensor_madoe_batterij
        below: 15
      card:
        type: tile
        entity: sensor.kamersensor_madoe_batterij
