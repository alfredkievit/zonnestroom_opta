    - type: tile
      entity: sensor.cv_ruimtesensor_temperatuur
      name: CV-ruimte
    - type: tile
      entity: sensor.smo_40_current_outd_temp_bt1
      name: Buiten
    - type: tile
      entity: sensor.smo_40_room_temperature_bt50
      name: Warmtepomp kamersensor (BT50)
  - type: grid
    cards:
    - type: heading
      heading: Luchtvochtigheid (rood boven 65%)
      heading_style: title
      icon: mdi:water-percent
    - type: gauge
      entity: sensor.kamersensor_woonkamer_luchtvochtigheid
      name: Woonkamer
      min: 0
      max: 100
      needle: true
      segments:
      - from: 0
        color: '#ff9800'
      - from: 30
        color: '#4caf50'
      - from: 60
        color: '#ff9800'
      - from: 65
        color: '#f44336'
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
      entity: sensor.kamersensor_eetkamer_luchtvochtigheid
      name: Eetkamer
      min: 0
      max: 100
      needle: true
      segments:
      - from: 0
        color: '#ff9800'
      - from: 30
        color: '#4caf50'
      - from: 60
        color: '#ff9800'
      - from: 65
        color: '#f44336'
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
      entity: sensor.kamersensor_alfred_luchtvochtigheid_2
