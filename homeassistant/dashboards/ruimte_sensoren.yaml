  - type: grid
    cards:
    - type: heading
      heading: Batterijen
      heading_style: title
      icon: mdi:battery
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kamersensor_woonkamer_batterij
        above: 14.99
      card:
        type: tile
        entity: sensor.kamersensor_woonkamer_batterij
        name: Woonkamer
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kamersensor_woonkamer_batterij
        below: 15
      card:
        type: tile
        entity: sensor.kamersensor_woonkamer_batterij
        name: Woonkamer
        color: red
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kamersensor_eetkamer_batterij
        above: 14.99
      card:
        type: tile
        entity: sensor.kamersensor_eetkamer_batterij
        name: Eetkamer
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kamersensor_eetkamer_batterij
        below: 15
      card:
        type: tile
        entity: sensor.kamersensor_eetkamer_batterij
        name: Eetkamer
        color: red
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kamersensor_alfred_batterij
        above: 14.99
      card:
        type: tile
        entity: sensor.kamersensor_alfred_batterij
        name: Alfred
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.kamersensor_alfred_batterij
        below: 15
      card:
        type: tile
        entity: sensor.kamersensor_alfred_batterij
        name: Alfred
        color: red
    - type: conditional
      conditions:
      - condition: numeric_state
