views:
- type: sections
  title: Kamers
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: 'Kamers: gewenste temperatuur'
      heading_style: title
      icon: mdi:thermometer
    - type: custom:bubble-card
      card_type: button
      button_type: slider
      entity: input_number.alfred_gewenste_temperatuur
      name: Alfred
      icon: mdi:home-thermometer-outline
      show_name: true
      card_layout: large1-1-rows
      grid_options:
        columns: 12
        rows: 1
      sub_button:
        main:
        - entity: sensor.kamersensor_alfred_temperatuur_2
          name: Huidig
          icon: mdi:thermometer
          show_background: false
          state_background: false
          state_content: state
        - entity: sensor.kamersensor_alfred_luchtvochtigheid_2
          name: RH
          icon: mdi:water-percent
          show_background: false
          state_background: false
          state_content: state
        bottom: []
      tap_action:
        action: perform-action
        perform_action: input_number.set_value
        target:
          entity_id: input_number.alfred_gewenste_temperatuur
        data:
          value: 21
      max_value: 30
      double_tap_action:
        action: none
      hold_action:
        action: perform-action
        perform_action: input_number.set_value
        target:
          entity_id: input_number.alfred_gewenste_temperatuur
